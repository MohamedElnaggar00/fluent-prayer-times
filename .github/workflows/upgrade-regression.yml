name: Installer upgrade regression (manual, isolated)
on:
  workflow_dispatch:
    inputs:
      new_installer_url:
        description: 'Installer under test (default: current published v1.3.4 installer)'
        required: false
        default: 'https://github.com/MohamedElnaggar00/fluent-prayer-times/releases/download/v1.3.4/FluentPrayerTimes-v1.3.4-installer-win-x64.exe'
      strict:
        description: 'Fail when more than one uninstall entry or install folder remains'
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  upgrade:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: custom-1.2.6
            url: https://github.com/MohamedElnaggar00/fluent-prayer-times/releases/download/v1.2.6/FluentPrayerTimes-v1.2.6-installer-win-x64.exe
            args: '--verify-install'
          - name: runtime-dependent-1.3.2
            url: https://github.com/MohamedElnaggar00/fluent-prayer-times/releases/download/v1.3.2/FluentPrayerTimes-v1.3.2-installer-.NET-runtime-dependent-win-x64.exe
            args: '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /LOG=C:\\inno-old.log'
          - name: self-contained-1.3.3
            url: https://github.com/MohamedElnaggar00/fluent-prayer-times/releases/download/v1.3.3/FluentPrayerTimes-v1.3.3-installer-win-x64.exe
            args: '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART'
    steps:
      - name: Prerequisites the older installers expect (.NET 8 desktop runtime, VC runtime, Windows App Runtime 1.6)
        if: matrix.name != 'self-contained-1.3.3'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          function Dep($url, $a) { $f = Join-Path $env:RUNNER_TEMP ([guid]::NewGuid().ToString() + '.exe'); Invoke-WebRequest $url -OutFile $f; $p = Start-Process $f -ArgumentList $a -Wait -PassThru; Write-Host "$url exit $($p.ExitCode)" }
          Dep 'https://aka.ms/dotnet/8.0/windowsdesktop-runtime-win-x64.exe' '/install /quiet /norestart'
          Dep 'https://aka.ms/vc14/vc_redist.x64.exe' '/install /quiet /norestart'
          Dep 'https://aka.ms/windowsappsdk/1.6/latest/windowsappruntimeinstall-x64.exe' '--quiet'
          Get-ChildItem "$env:ProgramFiles\dotnet\shared\Microsoft.NETCore.App" | Select-Object -ExpandProperty Name
      - name: Upgrade ${{ matrix.name }} to the installer under test
        shell: pwsh
        env:
          OLD_URL: ${{ matrix.url }}
          OLD_ARGS: ${{ matrix.args }}
          NEW_URL: ${{ inputs.new_installer_url }}
          STRICT: ${{ inputs.strict }}
        run: |
          $ErrorActionPreference = 'Stop'
          function Snap($label) {
            Write-Host "---- $label"
            $keys = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall','HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall','HKCU:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall'
            $rows = @()
            foreach ($k in $keys) {
              if (-not (Test-Path $k)) { continue }
              foreach ($item in Get-ChildItem $k) {
                $props = Get-ItemProperty $item.PSPath
                if ($props.DisplayName -like 'Fluent Prayer*') {
                  $rows += [pscustomobject]@{ Hive = $k.Substring(0,4); Key = $item.PSChildName; Name = $props.DisplayName; Version = $props.DisplayVersion; Location = $props.InstallLocation; Uninstall = $props.UninstallString }
                }
              }
            }
            $rows | Format-List | Out-String | Write-Host
            $dirs = @("$env:ProgramFiles\FluentPrayerTimes","$env:LOCALAPPDATA\Programs\FluentPrayerTimes-SelfContained","$env:LOCALAPPDATA\Programs\FluentPrayerTimes") | Where-Object { Test-Path "$_\FluentPrayerTimes.exe" }
            Write-Host ("install folders with exe: " + ($dirs -join '; '))
            return [pscustomobject]@{ Entries = @($rows).Count; Dirs = @($dirs).Count }
          }
          function Install($url, $args_, $file) {
            Invoke-WebRequest $url -OutFile $file
            $p = Start-Process $file -ArgumentList $args_ -Wait -PassThru
            Write-Host "installer exit code $($p.ExitCode)"
            if ($p.ExitCode -ne 0) { if (Test-Path C:\inno-old.log) { Get-Content C:\inno-old.log -Tail 25 }; throw "installer failed $($p.ExitCode)" }
            Get-Process FluentPrayerTimes -ErrorAction SilentlyContinue | Stop-Process -Force
          }
          Install $env:OLD_URL $env:OLD_ARGS "$env:RUNNER_TEMP\old.exe"
          $settings = "$env:APPDATA\FluentPrayerTimes"
          New-Item -ItemType Directory -Force $settings | Out-Null
          Set-Content "$settings\regression-marker.txt" 'settings must survive'
          $before = Snap 'after OLD install'
          Install $env:NEW_URL '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART' "$env:RUNNER_TEMP\new.exe"
          $after = Snap 'after NEW install'
          $kept = Test-Path "$settings\regression-marker.txt"
          Write-Host "settings marker kept: $kept"
          $line = "${{ matrix.name }}: old entries=$($before.Entries) folders=$($before.Dirs); after upgrade entries=$($after.Entries) folders=$($after.Dirs); settings kept=$kept"
          Write-Host "RESULT $line"
          Add-Content $env:GITHUB_STEP_SUMMARY $line
          if ($env:STRICT -eq 'true' -and ($after.Entries -ne 1 -or $after.Dirs -ne 1 -or -not $kept)) { throw "upgrade left duplicates or lost settings: $line" }
