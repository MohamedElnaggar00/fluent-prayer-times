name: Apply inline update cards (no release)
on:
  push:
    paths: ['.github/workflows/update-cards.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply scoped UI patch
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 -d | gzip -d > /tmp/update-cards.patch
          git apply --check /tmp/update-cards.patch
          git apply /tmp/update-cards.patch
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u
          git commit -m 'Unify manual update results as Sakhr-style inline cards'
          git push origin HEAD:main
