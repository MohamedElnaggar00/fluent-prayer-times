name: Build clean-named downloads
on:
  push:
    branches: ['**']
    paths: ['.github/workflows/self-contained.yml']
  workflow_dispatch:
    inputs:
      publish:
        description: 'Add verified assets to the existing release (after screenshot review)'
        type: boolean
        default: false
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v1.3.3
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Publish fully self-contained app
        shell: pwsh
        run: |
          dotnet publish FluentPrayerTimes.csproj -c Release -r win-x64 -p:Platform=x64 --self-contained true -p:WindowsAppSDKSelfContained=true -p:WindowsAppSdkBootstrapInitialize=false -p:DebugType=none -p:Version=1.3.3 -o publish
          if ($LASTEXITCODE -ne 0) { throw 'App publish failed' }
          # Ship Microsoft's app-local VC runtime rather than installing a machine-wide redistributable.
          $vs = & "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe" -latest -property installationPath
          $crt = Get-ChildItem "$vs/VC/Redist/MSVC/*/x64/Microsoft.VC*.CRT" -Directory | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $crt) { throw 'Microsoft app-local VC runtime not found' }
          Copy-Item "$($crt.FullName)/*.dll" publish -Force
      - name: Verify local dependencies and remove shared Windows App Runtime from test runner
        shell: pwsh
        run: |
          $config = Get-Content publish/FluentPrayerTimes.runtimeconfig.json -Raw | ConvertFrom-Json
          if ($config.runtimeOptions.framework -or $config.runtimeOptions.frameworks) { throw 'Still depends on shared .NET' }
          foreach ($file in @('FluentPrayerTimes.exe','Microsoft.WinUI.dll','Microsoft.WindowsAppRuntime.dll','coreclr.dll','hostfxr.dll','vcruntime140.dll','msvcp140.dll')) {
            if (-not (Test-Path "publish/$file")) { throw "Missing bundled dependency: $file" }
          }
          Import-Module Appx -UseWindowsPowerShell
          Get-AppxPackage '*WindowsAppRuntime*' | Remove-AppxPackage -ErrorAction Stop
          if (Get-AppxPackage '*WindowsAppRuntime*') { throw 'Shared Windows App Runtime remains installed for runner user' }
          $env:DOTNET_MULTILEVEL_LOOKUP = '0'
          $env:DOTNET_ROOT = "$env:RUNNER_TEMP/no-shared-dotnet"
          New-Item -ItemType Directory -Force $env:DOTNET_ROOT | Out-Null
          $p = Start-Process "$PWD/publish/FluentPrayerTimes.exe" -PassThru
          Start-Sleep -Seconds 15
          if ($p.HasExited) { throw "Self-contained launch failed: $($p.ExitCode)" }
          $local = (Resolve-Path publish).Path
          $modules = @($p.Modules | Where-Object { $_.ModuleName -match '^(coreclr|Microsoft.WinUI|Microsoft.WindowsAppRuntime|hostfxr)\.dll$' })
          foreach ($name in @('coreclr.dll','Microsoft.WinUI.dll','Microsoft.WindowsAppRuntime.dll')) {
            $module = $modules | Where-Object ModuleName -eq $name
            if (-not $module -or -not $module.FileName.StartsWith($local, [StringComparison]::OrdinalIgnoreCase)) { throw "Dependency not loaded locally: $name" }
          }
          $modules | Select-Object ModuleName,FileName | ConvertTo-Json | Set-Content dependency-proof.json
          Add-Type -AssemblyName System.Drawing,System.Windows.Forms
          Add-Type -AssemblyName System.Drawing,System.Windows.Forms
          $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bitmap = New-Object System.Drawing.Bitmap $bounds.Width,$bounds.Height
          $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
          $graphics.CopyFromScreen($bounds.Location,[System.Drawing.Point]::Empty,$bounds.Size)
          $bitmap.Save("$PWD/app-launch.png")
          $graphics.Dispose(); $bitmap.Dispose()
          Stop-Process -Id $p.Id -Force
      - name: Package portable archive and per-user installer
        shell: pwsh
        run: |
          @'
          FluentPrayerTimes 1.3.3 - x64
          Windows 10 version 1809 or later / Windows 11 (x64).
          Extract the entire ZIP before running FluentPrayerTimes.exe. Keep all files together.
          .NET, Windows App SDK, and VC runtime files are bundled. No runtime installation is required.
          The installer installs for the current user without administrator rights.
          Portable ZIP and installer include the same bundled dependencies.
          brought to you by Instinct - https://instinct.com
          '@ | Set-Content publish/README.txt -Encoding utf8
          Copy-Item LICENSE publish/LICENSE.txt
          Compress-Archive -Path publish/* -DestinationPath 'FluentPrayerTimes-v1.3.3-portable-win-x64.zip'
          @'
          [Setup]
          AppId=FluentPrayerTimes-SelfContained
          AppName=Fluent Prayer Times
          AppVersion=1.3.3
          AppPublisher=Mohamed Elnaggar
          AppPublisherURL=https://instinct.com
          DefaultDirName={localappdata}\Programs\FluentPrayerTimes-SelfContained
          DefaultGroupName=Fluent Prayer Times
          PrivilegesRequired=lowest
          ArchitecturesAllowed=x64compatible
          ArchitecturesInstallIn64BitMode=x64compatible
          OutputDir=out
          OutputBaseFilename=FluentPrayerTimes-v1.3.3-installer-win-x64
          Compression=lzma2
          SolidCompression=yes
          WizardStyle=modern
          SetupIconFile=publish\app.ico
          CloseApplications=yes
          RestartApplications=no
          UninstallDisplayIcon={app}\FluentPrayerTimes.exe
          [Files]
          Source: "publish\*"; DestDir: "{app}"; Flags: ignoreversion recursesubdirs createallsubdirs
          [Icons]
          Name: "{autoprograms}\Fluent Prayer Times"; Filename: "{app}\FluentPrayerTimes.exe"; WorkingDir: "{app}"
          Name: "{autodesktop}\Fluent Prayer Times"; Filename: "{app}\FluentPrayerTimes.exe"; WorkingDir: "{app}"
          [InstallDelete]
          Type: files; Name: "{autodesktop}\Fluent Prayer Times (Self-contained).lnk"
          Type: files; Name: "{autoprograms}\Fluent Prayer Times (Self-contained).lnk"
          [Run]
          Filename: "{app}\FluentPrayerTimes.exe"; Description: "Launch Fluent Prayer Times"; Flags: nowait postinstall skipifsilent
          [Messages]
          WelcomeLabel2=This edition includes .NET and Windows App Runtime. No runtime download or administrator rights are required.%n%nbrought to you by Instinct
          '@ | Set-Content self-contained.iss -Encoding utf8
          & "${env:ProgramFiles(x86)}/Inno Setup 6/ISCC.exe" self-contained.iss
          if ($LASTEXITCODE -ne 0) { throw 'Installer build failed' }
          Copy-Item out/*.exe .
      - name: Verify installer extraction and installed launch
        shell: pwsh
        run: |
          $p = Start-Process './FluentPrayerTimes-v1.3.3-installer-win-x64.exe' -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Installer failed: $($p.ExitCode)" }
          $root = "$env:LOCALAPPDATA/Programs/FluentPrayerTimes-SelfContained"
          if (-not (Test-Path "$root/FluentPrayerTimes.exe")) { throw 'Per-user install missing' }
          $desktop = [Environment]::GetFolderPath('Desktop')
          $programs = [Environment]::GetFolderPath('Programs')
          foreach ($dir in @($desktop,$programs)) {
            if (-not (Test-Path "$dir/Fluent Prayer Times.lnk")) { throw 'Clean shortcut missing' }
            if (Test-Path "$dir/Fluent Prayer Times (Self-contained).lnk") { throw 'Old shortcut remains' }
          }
          $p = Start-Process "$root/FluentPrayerTimes.exe" -PassThru
          Start-Sleep -Seconds 10
          if ($p.HasExited) { throw "Installed launch failed: $($p.ExitCode)" }
          Add-Type -AssemblyName System.Drawing,System.Windows.Forms
          $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bitmap = New-Object System.Drawing.Bitmap $bounds.Width,$bounds.Height
          $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
          $graphics.CopyFromScreen($bounds.Location,[System.Drawing.Point]::Empty,$bounds.Size)
          $bitmap.Save("$PWD/installed-launch.png")
          $graphics.Dispose(); $bitmap.Dispose()
          Stop-Process -Id $p.Id -Force
      - name: Build full offline kit with signed Microsoft installers
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force offline/runtimes | Out-Null
          Copy-Item 'FluentPrayerTimes-v1.3.3-installer-win-x64.exe' offline/Install.exe
          $downloads = @(
            @{ url='https://builds.dotnet.microsoft.com/dotnet/WindowsDesktop/8.0.31/windowsdesktop-runtime-8.0.31-win-x64.exe'; name='windowsdesktop-runtime-x64.exe'; sha512='605189223cf0a64bfb5453520b794d1d386a97c7e65e3944feaf9214db1a8b247f66c569265aef4204447baf5b5ff19559c323d887e1318f17deb28a5af0fa12' },
            @{ url='https://aka.ms/windowsappsdk/1.6/1.6.250602001/windowsappruntimeinstall-x64.exe'; name='windowsappruntimeinstall-x64.exe'; sha512='' },
            @{ url='https://aka.ms/vc14/vc_redist.x64.exe'; name='vc_redist.x64.exe'; sha512='' }
          )
          foreach ($file in $downloads) {
            $path = "offline/runtimes/$($file.name)"
            Invoke-WebRequest $file.url -OutFile $path
            $sig = Get-AuthenticodeSignature $path
            if ($sig.Status -ne 'Valid' -or $sig.SignerCertificate.Subject -notmatch 'Microsoft Corporation') { throw "Invalid Microsoft signature: $path" }
            if ($file.sha512 -and (Get-FileHash $path -Algorithm SHA512).Hash -ne $file.sha512) { throw '.NET checksum mismatch' }
          }
          @'
          Full offline kit
          Run Install.exe to install the app without internet or administrator rights.
          The app includes .NET, Windows App SDK and VC runtime files. No separate runtime installation is required.
          The runtimes folder additionally contains the original signed Microsoft offline installers for .NET Desktop Runtime 8, Windows App Runtime 1.6 and Visual C++ x64.
          These optional system installers can require administrator rights. They are not needed to run this app.
          '@ | Set-Content offline/README.txt -Encoding utf8
          Get-ChildItem offline -Recurse -File | Get-FileHash -Algorithm SHA256 | Select-Object Path,Hash | ConvertTo-Json | Set-Content offline/SHA256.json
          Compress-Archive offline/* 'FluentPrayerTimes-v1.3.3-full-offline-win-x64.zip'
          Expand-Archive 'FluentPrayerTimes-v1.3.3-full-offline-win-x64.zip' offline-test
          $test = Start-Process './offline-test/Install.exe' -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait -PassThru
          if ($test.ExitCode -ne 0) { throw 'Offline kit install failed' }
          $app = Start-Process "$env:LOCALAPPDATA/Programs/FluentPrayerTimes-SelfContained/FluentPrayerTimes.exe" -PassThru
          Start-Sleep -Seconds 10
          if ($app.HasExited) { throw 'Offline kit app launch failed' }
          Stop-Process -Id $app.Id -Force
      - uses: actions/upload-artifact@v4
        with:
          name: verified-downloads
          path: |
            FluentPrayerTimes-v1.3.3-*.zip
            FluentPrayerTimes-v1.3.3-*.exe
            app-launch.png
            dependency-proof.json
            installed-launch.png
      - name: Save launch screenshot for visual review
        if: github.event_name == 'push'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $d = "$env:RUNNER_TEMP/clean-names-review"
          New-Item -ItemType Directory -Force $d | Out-Null
          Copy-Item app-launch.png,installed-launch.png,dependency-proof.json $d
          Push-Location $d
          git init -q
          git config user.name github-actions
          git config user.email actions@github.com
          git add .
          git commit -qm 'Self-contained launch evidence'
          git -c "http.extraheader=AUTHORIZATION: basic $([Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes('x-access-token:' + $env:GH_TOKEN)))" push "https://github.com/${{ github.repository }}.git" HEAD:refs/heads/clean-names-review
          if ($LASTEXITCODE -ne 0) { throw 'Review evidence upload failed' }
          Pop-Location
      - name: Add new assets without replacing old downloads
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload v1.3.3 './FluentPrayerTimes-v1.3.3-portable-win-x64.zip' './FluentPrayerTimes-v1.3.3-installer-win-x64.exe' './FluentPrayerTimes-v1.3.3-full-offline-win-x64.zip'
          if ($LASTEXITCODE -ne 0) { throw 'Upload failed; existing assets were not replaced' }
          gh release view v1.3.3 --json body --jq .body > release-notes.md
          $body = Get-Content release-notes.md -Raw
          $body = $body.Replace('Self-contained downloads','Downloads').Replace('self-contained', 'bundled-runtime').Replace('Self-contained', 'Bundled-runtime')
          $body | Set-Content release-notes.md -Encoding utf8
          gh release edit v1.3.3 --notes-file release-notes.md
          if ($LASTEXITCODE -ne 0) { throw 'Notes update failed' }
          gh release view v1.3.3 --json assets > assets.json
          $assets = (Get-Content assets.json -Raw | ConvertFrom-Json).assets
          foreach ($name in @('FluentPrayerTimes-v1.3.3-portable-win-x64.zip','FluentPrayerTimes-v1.3.3-installer-win-x64.exe','FluentPrayerTimes-v1.3.3-full-offline-win-x64.zip')) {
            if (-not ($assets | Where-Object { $_.name -eq $name -and $_.size -gt 1000000 })) { throw "Missing replacement $name" }
          }
          foreach ($name in @('FluentPrayerTimes-v1.3.3-self-contained-portable-win-x64.zip','FluentPrayerTimes-v1.3.3-self-contained-installer-win-x64.exe')) {
            if ($assets | Where-Object name -eq $name) { gh release delete-asset v1.3.3 $name --yes; if ($LASTEXITCODE -ne 0) { throw 'Suffix cleanup failed' } }
          }
