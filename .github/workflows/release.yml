name: Build and Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (without v)'
        required: true
      publish:
        description: 'Publish verified self-contained assets'
        type: boolean
        default: false
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $v = if ('${{ github.event_name }}' -eq 'workflow_dispatch') { '${{ inputs.version }}' } else { '${{ github.ref_name }}'.TrimStart('v') }
          if ($v -notmatch '^\d+\.\d+\.\d+$') { throw 'Invalid version' }
          "value=$v" >> $env:GITHUB_OUTPUT
      - name: Publish fully self-contained app
        shell: pwsh
        run: |
          dotnet publish FluentPrayerTimes.csproj -c Release -r win-x64 -p:Platform=x64 --self-contained true -p:WindowsAppSDKSelfContained=true -p:WindowsAppSdkBootstrapInitialize=false -p:DebugType=none -p:Version=${{ steps.version.outputs.value }} -o publish
          if ($LASTEXITCODE -ne 0) { throw 'App publish failed' }
          # Ship Microsoft's app-local VC runtime rather than installing a machine-wide redistributable.
          $vs = & "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe" -latest -property installationPath
          $crt = Get-ChildItem "$vs/VC/Redist/MSVC/*/x64/Microsoft.VC*.CRT" -Directory | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $crt) { throw 'Microsoft app-local VC runtime not found' }
          Copy-Item "$($crt.FullName)/*.dll" publish -Force
      - name: Verify local dependencies and remove shared Windows App Runtime from test runner
        shell: pwsh
        run: |
          $config = Get-Content publish/FluentPrayerTimes.runtimeconfig.json -Raw | ConvertFrom-Json
          if ($config.runtimeOptions.framework -or $config.runtimeOptions.frameworks) { throw 'Still depends on shared .NET' }
          foreach ($file in @('FluentPrayerTimes.exe','Microsoft.WinUI.dll','Microsoft.WindowsAppRuntime.dll','coreclr.dll','hostfxr.dll','vcruntime140.dll','msvcp140.dll')) {
            if (-not (Test-Path "publish/$file")) { throw "Missing bundled dependency: $file" }
          }
          Import-Module Appx -UseWindowsPowerShell
          Get-AppxPackage '*WindowsAppRuntime*' | Remove-AppxPackage -ErrorAction Stop
          if (Get-AppxPackage '*WindowsAppRuntime*') { throw 'Shared Windows App Runtime remains installed for runner user' }
          $env:DOTNET_MULTILEVEL_LOOKUP = '0'
          $env:DOTNET_ROOT = "$env:RUNNER_TEMP/no-shared-dotnet"
          New-Item -ItemType Directory -Force $env:DOTNET_ROOT | Out-Null
          $p = Start-Process "$PWD/publish/FluentPrayerTimes.exe" -PassThru
          Start-Sleep -Seconds 15
          if ($p.HasExited) { throw "Self-contained launch failed: $($p.ExitCode)" }
          $local = (Resolve-Path publish).Path
          $modules = @($p.Modules | Where-Object { $_.ModuleName -match '^(coreclr|Microsoft.WinUI|Microsoft.WindowsAppRuntime|hostfxr)\.dll$' })
          foreach ($name in @('coreclr.dll','Microsoft.WinUI.dll','Microsoft.WindowsAppRuntime.dll')) {
            $module = $modules | Where-Object ModuleName -eq $name
            if (-not $module -or -not $module.FileName.StartsWith($local, [StringComparison]::OrdinalIgnoreCase)) { throw "Dependency not loaded locally: $name" }
          }
          $modules | Select-Object ModuleName,FileName | ConvertTo-Json | Set-Content dependency-proof.json
          Add-Type -AssemblyName System.Drawing,System.Windows.Forms
          Add-Type -AssemblyName System.Drawing,System.Windows.Forms
          $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bitmap = New-Object System.Drawing.Bitmap $bounds.Width,$bounds.Height
          $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
          $graphics.CopyFromScreen($bounds.Location,[System.Drawing.Point]::Empty,$bounds.Size)
          $bitmap.Save("$PWD/app-launch.png")
          $graphics.Dispose(); $bitmap.Dispose()
          Stop-Process -Id $p.Id -Force
      - name: Package portable archive and per-user installer
        shell: pwsh
        run: |
          @'
          FluentPrayerTimes ${{ steps.version.outputs.value }} - x64
          Windows 10 version 1809 or later / Windows 11 (x64).
          Extract the entire ZIP before running FluentPrayerTimes.exe. Keep all files together.
          .NET, Windows App SDK, and VC runtime files are bundled. No runtime installation is required.
          The installer installs for the current user without administrator rights.
          Portable ZIP and installer include the same bundled dependencies.
          brought to you by Instinct - https://instinct.com
          '@ | Set-Content publish/README.txt -Encoding utf8
          Copy-Item LICENSE publish/LICENSE.txt
          Compress-Archive -Path publish/* -DestinationPath 'FluentPrayerTimes-v${{ steps.version.outputs.value }}-portable-win-x64.zip'
          @'
          [Setup]
          AppId=FluentPrayerTimes-SelfContained
          AppName=Fluent Prayer Times
          AppVerName=Fluent Prayer Times
          UninstallDisplayName=Fluent Prayer Times
          AppVersion=${{ steps.version.outputs.value }}
          AppPublisher=Mohamed Elnaggar
          AppPublisherURL=https://instinct.com
          DefaultDirName={localappdata}\Programs\FluentPrayerTimes-SelfContained
          DefaultGroupName=Fluent Prayer Times
          PrivilegesRequired=lowest
          ArchitecturesAllowed=x64compatible
          ArchitecturesInstallIn64BitMode=x64compatible
          OutputDir=out
          OutputBaseFilename=FluentPrayerTimes-v${{ steps.version.outputs.value }}-installer-win-x64
          Compression=lzma2
          SolidCompression=yes
          WizardStyle=modern
          SetupIconFile=publish\app.ico
          CloseApplications=no
          RestartApplications=no
          UninstallDisplayIcon={app}\FluentPrayerTimes.exe
          [Files]
          Source: "publish\*"; DestDir: "{app}"; Flags: ignoreversion recursesubdirs createallsubdirs
          [Icons]
          Name: "{autoprograms}\Fluent Prayer Times"; Filename: "{app}\FluentPrayerTimes.exe"; WorkingDir: "{app}"
          Name: "{autodesktop}\Fluent Prayer Times"; Filename: "{app}\FluentPrayerTimes.exe"; WorkingDir: "{app}"
          [InstallDelete]
          Type: files; Name: "{autodesktop}\Fluent Prayer Times (Self-contained).lnk"
          Type: files; Name: "{autoprograms}\Fluent Prayer Times (Self-contained).lnk"
          [Run]
          Filename: "{app}\FluentPrayerTimes.exe"; Description: "Launch Fluent Prayer Times"; Flags: nowait postinstall skipifsilent
          [Code]
          function LegacyPresent: Boolean;
          begin
            Result := RegKeyExists(HKLM64, 'SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\FluentPrayerTimes_is1')
              or RegKeyExists(HKLM32, 'SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\FluentPrayerTimes_is1')
              or RegKeyExists(HKLM64, 'SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\FluentPrayerTimes');
          end;
          // Removes the older machine-wide editions (runtime-dependent installer, first-generation installer) so only this one install remains.
          // Only fixed, known locations are touched; no uninstall string from the registry is ever executed. User settings in AppData are not touched.
          function PrepareToInstall(var NeedsRestart: Boolean): String;
          var Rc: Integer;
          begin
            Result := '';
            Exec(ExpandConstant('{sys}\taskkill.exe'), '/F /IM FluentPrayerTimes.exe', '', SW_HIDE, ewWaitUntilTerminated, Rc);
            Sleep(800);
          end;

          procedure MigrateLegacy;
          var Script, Dir, F: String; Rc: Integer; Launched: Boolean;
          begin
            if not LegacyPresent then exit;
            Dir := ExpandConstant('{commonpf64}\FluentPrayerTimes');
            F := ExpandConstant('{tmp}\fpt-migrate.ps1');
            Script :=
              '$ErrorActionPreference = "SilentlyContinue"' + #13#10 +
              'Start-Transcript -Path "' + ExpandConstant('{commonappdata}') + '\FluentPrayerTimes-migrate.log" | Out-Null' + #13#10 +
              '$dir = "' + Dir + '"' + #13#10 +
              '$u = "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall"' + #13#10 +
              '$u32 = "HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall"' + #13#10 +
              'function Same($k) { $l = (Get-ItemProperty -LiteralPath $k).InstallLocation; return ($l -and ($l.TrimEnd("\") -ieq $dir)) }' + #13#10 +
              'try { $e = [Threading.EventWaitHandle]::OpenExisting("FluentPrayerTimes.Quit"); [void]$e.Set() } catch {}' + #13#10 +
              '$d = (Get-Date).AddSeconds(8); while ((Get-Process FluentPrayerTimes) -and ((Get-Date) -lt $d)) { Start-Sleep -Milliseconds 200 }' + #13#10 +
              'Get-Process FluentPrayerTimes | Stop-Process -Force' + #13#10 +
              'foreach ($k in "$u\FluentPrayerTimes_is1", "$u32\FluentPrayerTimes_is1") { if ((Test-Path -LiteralPath $k) -and (Same $k) -and (Test-Path "$dir\unins000.exe") -and (Test-Path "$dir\FluentPrayerTimes.exe")) { Start-Process "$dir\unins000.exe" -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait; break } }' + #13#10 +
              'if ((Test-Path -LiteralPath "$u\FluentPrayerTimes") -and (Same "$u\FluentPrayerTimes")) {' + #13#10 +
              '  if ((Test-Path "$dir\Uninstall.exe") -and (Test-Path "$dir\FluentPrayerTimes.exe")) { Remove-Item -LiteralPath $dir -Recurse -Force }' + #13#10 +
              '  Remove-Item -LiteralPath "$env:ProgramData\Microsoft\Windows\Start Menu\Programs\Fluent Prayer Times.lnk" -Force' + #13#10 +
              '  Remove-Item -LiteralPath "$env:PUBLIC\Desktop\Fluent Prayer Times.lnk" -Force' + #13#10 +
              '  Remove-Item -LiteralPath "$u\FluentPrayerTimes" -Recurse -Force' + #13#10 +
              '}' + #13#10;
            SaveStringToFile(F, Script, False);
            Launched := ShellExec('runas', ExpandConstant('{sys}\WindowsPowerShell\v1.0\powershell.exe'), '-NoProfile -ExecutionPolicy Bypass -File "' + F + '"', '', SW_HIDE, ewWaitUntilTerminated, Rc);
            if (not Launched) or LegacyPresent then
            begin
              Log('Older edition was NOT removed (administrator prompt declined or removal failed).');
              if not WizardSilent then
                MsgBox('Fluent Prayer Times was installed, but an older installation could not be removed because administrator permission was declined or the removal failed. Both entries are still listed in Installed apps. Run this installer again and accept the administrator prompt to finish. Your settings are not affected.', mbInformation, MB_OK);
            end
            else
              Log('Older edition removed.');
          end;
          // A startup entry written by an older edition points at the removed folder; point it at this install.
          procedure FixStartup;
          var V: String;
          begin
            if RegQueryStringValue(HKCU, 'Software\Microsoft\Windows\CurrentVersion\Run', 'FluentPrayerTimes', V) then
              if Pos(Lowercase(ExpandConstant('{commonpf64}\FluentPrayerTimes')), Lowercase(V)) > 0 then
                RegWriteStringValue(HKCU, 'Software\Microsoft\Windows\CurrentVersion\Run', 'FluentPrayerTimes', '"' + ExpandConstant('{app}\FluentPrayerTimes.exe') + '" --tray');
          end;
          procedure CurStepChanged(CurStep: TSetupStep);
          begin
            if CurStep = ssInstall then MigrateLegacy;
            if CurStep = ssPostInstall then FixStartup;
          end;
          [Messages]
          WelcomeLabel2=This edition includes .NET and Windows App Runtime. No runtime download or administrator rights are required.%n%nbrought to you by Instinct
          '@ | Set-Content self-contained.iss -Encoding utf8
          & "${env:ProgramFiles(x86)}/Inno Setup 6/ISCC.exe" self-contained.iss
          if ($LASTEXITCODE -ne 0) { throw 'Installer build failed' }
          Copy-Item out/*.exe .
      - name: Verify installer extraction and installed launch
        shell: pwsh
        run: |
          $p = Start-Process './FluentPrayerTimes-v${{ steps.version.outputs.value }}-installer-win-x64.exe' -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Installer failed: $($p.ExitCode)" }
          $root = "$env:LOCALAPPDATA/Programs/FluentPrayerTimes-SelfContained"
          if (-not (Test-Path "$root/FluentPrayerTimes.exe")) { throw 'Per-user install missing' }
          $desktop = [Environment]::GetFolderPath('Desktop')
          $programs = [Environment]::GetFolderPath('Programs')
          foreach ($dir in @($desktop,$programs)) {
            if (-not (Test-Path "$dir/Fluent Prayer Times.lnk")) { throw 'Clean shortcut missing' }
            if (Test-Path "$dir/Fluent Prayer Times (Self-contained).lnk") { throw 'Old shortcut remains' }
          }
          $p = Start-Process "$root/FluentPrayerTimes.exe" -PassThru
          Start-Sleep -Seconds 10
          if ($p.HasExited) { throw "Installed launch failed: $($p.ExitCode)" }
          Add-Type -AssemblyName System.Drawing,System.Windows.Forms
          $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bitmap = New-Object System.Drawing.Bitmap $bounds.Width,$bounds.Height
          $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
          $graphics.CopyFromScreen($bounds.Location,[System.Drawing.Point]::Empty,$bounds.Size)
          $bitmap.Save("$PWD/installed-launch.png")
          $graphics.Dispose(); $bitmap.Dispose()
          Stop-Process -Id $p.Id -Force
      - name: Build full offline kit with signed Microsoft installers
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force offline/runtimes | Out-Null
          Copy-Item 'FluentPrayerTimes-v${{ steps.version.outputs.value }}-installer-win-x64.exe' offline/Install.exe
          $downloads = @(
            @{ url='https://builds.dotnet.microsoft.com/dotnet/WindowsDesktop/8.0.31/windowsdesktop-runtime-8.0.31-win-x64.exe'; name='windowsdesktop-runtime-x64.exe'; sha512='605189223cf0a64bfb5453520b794d1d386a97c7e65e3944feaf9214db1a8b247f66c569265aef4204447baf5b5ff19559c323d887e1318f17deb28a5af0fa12' },
            @{ url='https://aka.ms/windowsappsdk/1.6/1.6.250602001/windowsappruntimeinstall-x64.exe'; name='windowsappruntimeinstall-x64.exe'; sha512='' },
            @{ url='https://aka.ms/vc14/vc_redist.x64.exe'; name='vc_redist.x64.exe'; sha512='' }
          )
          foreach ($file in $downloads) {
            $path = "offline/runtimes/$($file.name)"
            Invoke-WebRequest $file.url -OutFile $path
            $sig = Get-AuthenticodeSignature $path
            if ($sig.Status -ne 'Valid' -or $sig.SignerCertificate.Subject -notmatch 'Microsoft Corporation') { throw "Invalid Microsoft signature: $path" }
            if ($file.sha512 -and (Get-FileHash $path -Algorithm SHA512).Hash -ne $file.sha512) { throw '.NET checksum mismatch' }
          }
          @'
          Full offline kit
          Run Install.exe to install the app without internet or administrator rights.
          The app includes .NET, Windows App SDK and VC runtime files. No separate runtime installation is required.
          The runtimes folder additionally contains the original signed Microsoft offline installers for .NET Desktop Runtime 8, Windows App Runtime 1.6 and Visual C++ x64.
          These optional system installers can require administrator rights. They are not needed to run this app.
          '@ | Set-Content offline/README.txt -Encoding utf8
          Get-ChildItem offline -Recurse -File | Get-FileHash -Algorithm SHA256 | Select-Object Path,Hash | ConvertTo-Json | Set-Content offline/SHA256.json
          Compress-Archive offline/* 'FluentPrayerTimes-v${{ steps.version.outputs.value }}-full-offline-win-x64.zip'
          Expand-Archive 'FluentPrayerTimes-v${{ steps.version.outputs.value }}-full-offline-win-x64.zip' offline-test
          $test = Start-Process './offline-test/Install.exe' -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait -PassThru
          if ($test.ExitCode -ne 0) { throw 'Offline kit install failed' }
          $app = Start-Process "$env:LOCALAPPDATA/Programs/FluentPrayerTimes-SelfContained/FluentPrayerTimes.exe" -PassThru
          Start-Sleep -Seconds 10
          if ($app.HasExited) { throw 'Offline kit app launch failed' }
          Stop-Process -Id $app.Id -Force
      - uses: actions/upload-artifact@v4
        with:
          name: verified-downloads
          path: |
            FluentPrayerTimes-v${{ steps.version.outputs.value }}-*.zip
            FluentPrayerTimes-v${{ steps.version.outputs.value }}-*.exe
            app-launch.png
            dependency-proof.json
            installed-launch.png
      - name: Add new assets without replacing old downloads
        if: github.event_name == 'push' || inputs.publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v${{ steps.version.outputs.value }} --json tagName | Out-Null
          if ($LASTEXITCODE -ne 0) { gh release create v${{ steps.version.outputs.value }} --draft --title 'v${{ steps.version.outputs.value }}' --notes 'Self-contained release: bundled runtimes, portable archive and per-user installer.' }
          gh release upload v${{ steps.version.outputs.value }} './FluentPrayerTimes-v${{ steps.version.outputs.value }}-portable-win-x64.zip' './FluentPrayerTimes-v${{ steps.version.outputs.value }}-installer-win-x64.exe' './FluentPrayerTimes-v${{ steps.version.outputs.value }}-full-offline-win-x64.zip'
          if ($LASTEXITCODE -ne 0) { throw 'Upload failed; existing assets were not replaced' }
          $body = gh release view v${{ steps.version.outputs.value }} --json body --jq .body
          $body + "`n`n## Self-contained downloads`n- Added portable ZIP and per-user installer with bundled .NET, Windows App SDK and VC runtime files. No separate runtime installation is required.`n- Windows 10 1809+ / Windows 11 x64. Self-contained is the default distribution.`n`n## التنزيلات المستقلة`n- أُضيفت نسخة محمولة ومثبت للمستخدم الحالي يتضمنان ملفات التشغيل المطلوبة، دون تثبيت بيئة تشغيل منفصلة أو صلاحيات مسؤول.`n- Windows 10 1809 أو أحدث وWindows 11 بمعمارية x64. النسخة المستقلة هي النسخة الافتراضية للتوزيع." | Set-Content release-notes.md -Encoding utf8
          gh release edit v${{ steps.version.outputs.value }} --notes-file release-notes.md
          if ($LASTEXITCODE -ne 0) { throw 'Notes update failed' }
