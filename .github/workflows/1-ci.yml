name: CI (build, self-test, screenshots)
on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md', 'docs/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Publish
        shell: pwsh
        run: |
          dotnet publish FluentPrayerTimes.csproj -c Release -r win-x64 -p:Platform=x64 --self-contained false -p:DebugType=none -o publish
          if ($LASTEXITCODE -ne 0) { throw 'publish failed' }
      - name: Install Windows App Runtime
        shell: pwsh
        run: |
          Invoke-WebRequest https://aka.ms/windowsappsdk/1.6/latest/windowsappruntimeinstall-x64.exe -OutFile wari.exe
          Start-Process .\wari.exe -ArgumentList '--quiet' -Wait
      - name: Logic self-test
        shell: pwsh
        run: |
          $p = Start-Process publish\FluentPrayerTimes.exe -ArgumentList '--selftest' -PassThru -Wait
          $log = Join-Path $env:APPDATA 'FluentPrayerTimes\selftest.log'
          if (Test-Path $log) { Get-Content $log | Select-Object -Last 5 }
          if ($p.ExitCode -ne 0) { throw "selftest failed $($p.ExitCode)" }
      - name: Update download end-to-end (real release, nothing installed)
        shell: pwsh
        run: |
          $p = Start-Process publish\FluentPrayerTimes.exe -ArgumentList '--update-e2e' -PassThru -Wait
          $log = Join-Path $env:APPDATA 'FluentPrayerTimes\update-e2e.log'
          if (Test-Path $log) { Get-Content $log }
          if ($p.ExitCode -ne 0) { throw "update e2e failed $($p.ExitCode)" }
      - name: Runtime behaviour checks (first-run location, saved location, notification switches)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force shots | Out-Null
          $dir = Join-Path $env:APPDATA 'FluentPrayerTimes'; $sf = Join-Path $dir 'settings.json'
          $out = New-Object System.Collections.Generic.List[string]; $bad = New-Object System.Collections.Generic.List[string]
          function Reset { Get-Process FluentPrayerTimes -ErrorAction SilentlyContinue | Stop-Process -Force; Start-Sleep 2; Remove-Item $dir -Recurse -Force -ErrorAction SilentlyContinue; New-Item -ItemType Directory -Force $dir | Out-Null }
          function Run($a, $sec) { $p = Start-Process publish\FluentPrayerTimes.exe -ArgumentList $a -PassThru; Start-Sleep $sec; Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue; Start-Sleep 2 }
          function Expect($name, $ok) { if ($ok) { $out.Add("PASS $name") } else { $out.Add("FAIL $name"); $bad.Add($name) } }
          # 1. fresh install, automatic detection succeeds (lookup result injected, the app flow is real)
          Reset; Run @('--e2e-detect=ok') 25
          $j = if (Test-Path $sf) { Get-Content $sf -Raw | ConvertFrom-Json } else { $null }
          Expect 'fresh install + detection ok: detected place saved, no longer pending' ($j -ne $null -and $j.Location.Name -eq 'E2E City' -and -not $j.LocationPending)
          # 2. fresh install, detection fails: nothing guessed, stays pending
          Reset; Run @('--e2e-detect=fail') 20
          $j = if (Test-Path $sf) { Get-Content $sf -Raw | ConvertFrom-Json } else { $null }
          Expect 'fresh install + detection fails: no location saved, still pending' ($j -eq $null -or ($j.LocationPending -eq $true -and $j.Location.Name -eq 'Alexandria'))
          # 3. fresh install, real lookup (Windows location, then IP) on the runner: informational
          Reset; Run @() 75
          $out.Add('INFO real lookup on the runner: ' + $(if (Test-Path $sf) { (Get-Content $sf -Raw | ConvertFrom-Json | ForEach-Object { "name=$($_.Location.Name) lat=$($_.Location.Lat) pending=$($_.LocationPending)" }) } else { 'no settings saved (lookup failed, still pending)' }))
          # 4. existing saved location is kept
          Reset
          '{"Location":{"Name":"Paris","NameAr":"Paris","Lat":48.8566,"Lon":2.3522,"UseCity":false,"CountryAr":"France","Cc":"FR","Tz":"Europe/Paris"}}' | Set-Content $sf
          Run @('--e2e-detect=ok') 20
          $j = Get-Content $sf -Raw | ConvertFrom-Json
          Expect 'existing saved location (Paris) kept, no lookup' ($j.Location.Name -eq 'Paris' -and -not $j.LocationPending)
          # 5. notification switches through the real scheduler with the clock pinned to Dhuhr adhan / iqama
          $cases = @(
            @('both on', 'AdhanNotify=true;IqamaNotify=true', $true, $true),
            @('adhan off, iqama on', 'AdhanNotify=false;IqamaNotify=true', $false, $true),
            @('adhan on, iqama off', 'AdhanNotify=true;IqamaNotify=false', $true, $false),
            @('master off', 'NotifyAdhan=false;AdhanNotify=true;IqamaNotify=true', $false, $false))
          foreach ($c in $cases) {
            foreach ($clk in 'adhan','iqama') {
              Reset; '{}' | Set-Content $sf
              $log = Join-Path $env:RUNNER_TEMP "n-$($c[0] -replace ' |,','_')-$clk.txt"; Remove-Item $log -ErrorAction SilentlyContinue
              Run @("--e2e-set=$($c[1])", "--e2e-clock=$clk", "--e2e-log=$log") 25
              $txt = if (Test-Path $log) { Get-Content $log -Raw } else { '' }
              $gotAdhan = $txt -match 'adhan\|'; $gotIqama = $txt -match 'iqama\|'
              $wantAdhan = ($clk -eq 'adhan') -and $c[2]; $wantIqama = ($clk -eq 'iqama') -and $c[3]
              Expect "notifications [$($c[0])] at $clk time: adhan=$wantAdhan iqama=$wantIqama" ($gotAdhan -eq $wantAdhan -and $gotIqama -eq $wantIqama)
            }
          }
          Reset; Remove-Item $dir -Recurse -Force -ErrorAction SilentlyContinue
          $out | Tee-Object -FilePath shots/e2e-results.txt
          if ($bad.Count -gt 0) { throw "runtime checks failed: $($bad -join '; ')" }
      - name: Captures
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          New-Item -ItemType Directory -Force shots | Out-Null
          function Shot($name) {
            $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
            $bmp.Save("shots/$name.png"); $g.Dispose(); $bmp.Dispose()
          }
          foreach ($it in 'en|main','en|settings','en|calculation','en|sounds','ar|sounds','en|sounds-closed','ar|sounds-closed','en|nolocation','ar|nolocation','en|nolocation-settings','en|widget','en|hover','ar|calculation','ar|widget','ar|hover','en|update','en|update-live','en|update-downloading','ar|update-downloading','en|update-ready','en|update-error','ar|update-error','en|updates-about-current','ar|updates-about-current','en|updates-about-available','ar|updates-about-available','en|updates-settings-current','ar|updates-settings-current','en|updates-about-error','ar|updates-about-error','en|updates-about-checking','ar|updates-about-checking','en|updates-about-current','ar|updates-about-current','en|updates-about-available','ar|updates-about-available','en|updates-settings-current','ar|updates-settings-current','en|updates-about-error','ar|updates-about-error','en|updates-about-checking','ar|updates-about-checking') {
            $lang,$part = $it.Split('|')
            $p = Start-Process publish\FluentPrayerTimes.exe -ArgumentList "--preview=iqama","--part=$part","--lang=$lang" -PassThru
            Start-Sleep -Seconds 7
            if ($part -eq 'update-live') { Start-Sleep -Seconds 50 }
            Shot "$lang-$part"
            if ($part -eq 'hover') {
              Start-Process notepad.exe -WindowStyle Maximized
              Start-Sleep -Seconds 4
              Shot "hover-over-notepad"
              Get-Process notepad -ErrorAction SilentlyContinue | Stop-Process -Force
            }
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
            Start-Sleep -Seconds 1
          }
          $pl = Join-Path $env:APPDATA 'FluentPrayerTimes\preview.log'
          if (Test-Path $pl) { Get-Content $pl; Copy-Item $pl shots\preview.log }
      - name: Build and verify installers (no release)
        shell: pwsh
        run: |
          Compress-Archive -Path publish/* -DestinationPath installer/payload.zip
          dotnet publish installer/Installer.csproj -c Release -r win-x64 --self-contained true -p:DebugType=none -o setup
          if ($LASTEXITCODE -ne 0) { throw 'Installer publish failed' }
          & "${env:ProgramFiles(x86)}/Inno Setup 6/ISCC.exe" installer/RuntimeBootstrapper.iss
          if ($LASTEXITCODE -ne 0) { throw 'Native bootstrapper compile failed' }
          $p = Start-Process setup/FluentPrayerTimes-Setup.exe -ArgumentList '--preview',"$PWD/shots/installer.png" -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw 'Installer preview failed' }
          $native = (Get-ChildItem out/*.exe)[0].FullName
          $p = Start-Process $native -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/LOG=$PWD/shots/native-install.log" -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw 'Native install test failed' }
          $exe = Join-Path $env:ProgramFiles 'FluentPrayerTimes/FluentPrayerTimes.exe'
          $p = Start-Process $exe -ArgumentList '--tray' -PassThru
          Start-Sleep -Seconds 8
          if ($p.HasExited) { throw 'Installed app exited early' }
          Stop-Process -Id $p.Id -Force
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-screenshots
          path: |
            shots/
            publish/
            setup/FluentPrayerTimes-Setup.exe
            out/*.exe
