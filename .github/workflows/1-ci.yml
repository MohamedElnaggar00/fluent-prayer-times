name: CI (build, self-test, screenshots)
on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md', 'docs/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Publish
        shell: pwsh
        run: |
          dotnet publish FluentPrayerTimes.csproj -c Release -r win-x64 -p:Platform=x64 --self-contained false -p:DebugType=none -o publish
          if ($LASTEXITCODE -ne 0) { throw 'publish failed' }
      - name: Install Windows App Runtime
        shell: pwsh
        run: |
          Invoke-WebRequest https://aka.ms/windowsappsdk/1.6/latest/windowsappruntimeinstall-x64.exe -OutFile wari.exe
          Start-Process .\wari.exe -ArgumentList '--quiet' -Wait
      - name: Logic self-test
        shell: pwsh
        run: |
          $p = Start-Process publish\FluentPrayerTimes.exe -ArgumentList '--selftest' -PassThru -Wait
          $log = Join-Path $env:APPDATA 'FluentPrayerTimes\selftest.log'
          if (Test-Path $log) { Get-Content $log | Select-Object -Last 5 }
          if ($p.ExitCode -ne 0) { throw "selftest failed $($p.ExitCode)" }
      - name: Captures
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          New-Item -ItemType Directory -Force shots | Out-Null
          function Shot($name) {
            $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
            $bmp.Save("shots/$name.png"); $g.Dispose(); $bmp.Dispose()
          }
          foreach ($it in 'en|main','en|settings','en|widget','en|update','ar|main','ar|settings','ar|widget') {
            $lang,$part = $it.Split('|')
            $p = Start-Process publish\FluentPrayerTimes.exe -ArgumentList "--preview=next","--part=$part","--lang=$lang" -PassThru
            Start-Sleep -Seconds 7
            Shot "$lang-$part"
            if ($part -eq 'hover') {
              Start-Process notepad.exe -WindowStyle Maximized
              Start-Sleep -Seconds 4
              Shot "hover-over-notepad"
              Get-Process notepad -ErrorAction SilentlyContinue | Stop-Process -Force
            }
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
            Start-Sleep -Seconds 1
          }
          $pl = Join-Path $env:APPDATA 'FluentPrayerTimes\preview.log'
          if (Test-Path $pl) { Get-Content $pl; Copy-Item $pl shots\preview.log }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-screenshots
          path: shots/
